<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5d71" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>
  
  <!-- App Icon Background Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" />
  
  <!-- Orbiting Dotted Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="14 10" opacity="0.3" />
  
  <!-- Glowing Medical Heart Icon -->
  <g filter="url(#glow)">
    <path d="M256 410 C240 395 120 300 120 205 A85 85 0 0 1 256 135 A85 85 0 0 1 392 205 C392 300 272 395 256 410 Z" fill="url(#heartGrad)" />
    
    <!-- Medical Plus Cross in Center -->
    <rect x="236" y="200" width="40" height="110" rx="10" fill="#0b5d71" />
    <rect x="201" y="235" width="110" height="40" rx="10" fill="#0b5d71" />
  </g>

  <!-- EKG Vital Pulse Line -->
  <path d="M60 330 L160 330 L185 295 L210 365 L240 270 L270 380 L295 315 L320 330 L452 330" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
</svg>